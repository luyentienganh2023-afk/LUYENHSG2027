<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện thi HSG Tiếng Anh</title>
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fa;--surface:#fff;--surface-2:#f1f3f9;--ink:#111827;--ink-2:#374151;--muted:#6b7280;--line:#e5e7ef;
  --brand:#4338ca;--brand-2:#6366f1;--brand-soft:#eef0ff;--on-brand:#fff;
  --ok:#15803d;--ok-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;
  --L:#7c3aed;--L-soft:#f3e8ff;--U:#2563eb;--U-soft:#dbeafe;--R:#059669;--R-soft:#d1fae5;--W:#d97706;--W-soft:#fef3c7;
  --radius:16px;--radius-sm:10px;--shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px rgba(17,24,39,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120;--surface:#171a2c;--surface-2:#1f2338;--ink:#eceef6;--ink-2:#c3c8d8;--muted:#8d94aa;--line:#2b3047;
  --brand:#8b93ff;--brand-2:#a5abff;--brand-soft:#252a52;--on-brand:#0e1120;
  --ok:#4ade80;--ok-soft:#123224;--bad:#f87171;--bad-soft:#3b1a1d;--warn:#fbbf24;--warn-soft:#3a2d10;
  --L:#c4a5ff;--L-soft:#2c2148;--U:#7fb0ff;--U-soft:#1b2a4a;--R:#5fd3a8;--R-soft:#13332a;--W:#f5b453;--W-soft:#3a2a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1120;--surface:#171a2c;--surface-2:#1f2338;--ink:#eceef6;--ink-2:#c3c8d8;--muted:#8d94aa;--line:#2b3047;
  --brand:#8b93ff;--brand-2:#a5abff;--brand-soft:#252a52;--on-brand:#0e1120;
  --ok:#4ade80;--ok-soft:#123224;--bad:#f87171;--bad-soft:#3b1a1d;--warn:#fbbf24;--warn-soft:#3a2d10;
  --L:#c4a5ff;--L-soft:#2c2148;--U:#7fb0ff;--U-soft:#1b2a4a;--R:#5fd3a8;--R-soft:#13332a;--W:#f5b453;--W-soft:#3a2a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--surface)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:none;background:none;padding:8px 12px;border-radius:999px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.nav .lbl{display:none}
@media(min-width:720px){.nav .lbl{display:inline}}
.avatar{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);font-weight:700;color:var(--brand);flex:none}
.menu{position:absolute;right:16px;top:58px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:230px;padding:6px;z-index:40}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:flex;width:100%;text-align:left;border:none;background:none;padding:10px 12px;border-radius:10px;gap:10px;align-items:center}
.menu button:hover{background:var(--surface-2)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
h1,h2,h3{letter-spacing:-.015em;margin:0}
h1{font-size:24px}
h2{font-size:19px}
h3{font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.lv-B1{background:#e0f2fe;color:#0369a1}.lv-B2{background:#ede9fe;color:#6d28d9}.lv-C1{background:#ffe4e6;color:#be123c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv-B1{background:#0c2d44;color:#7dd3fc}:root:not([data-theme="light"]) .lv-B2{background:#2a1f4d;color:#c4b5fd}:root:not([data-theme="light"]) .lv-C1{background:#45121f;color:#fda4af}}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.grid2{display:grid;gap:0 12px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;justify-content:center;padding:60px 16px;color:var(--muted)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 10% -10%,var(--brand-soft),transparent),radial-gradient(900px 500px at 110% 110%,var(--L-soft),transparent),var(--bg)}
.auth .card{width:100%;max-width:440px;padding:26px}
.auth .head{text-align:center;margin-bottom:18px}
.auth .head .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 12px}
.auth .seg{width:100%;margin-bottom:18px}
.auth .seg button{flex:1}
.notice{padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
.notice.err{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.info{background:var(--brand-soft);color:var(--brand)}

/* ---------- home ---------- */
.hello{margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.parts{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.parts{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.parts{grid-template-columns:repeat(4,1fr)}}
.part{padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;border:1px solid var(--line);text-align:left;width:100%}
.part:hover{transform:translateY(-2px)}
.part .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.part h3{font-size:18px}
.part p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.part .row{gap:6px}
.pc-LISTENING .ic{background:var(--L-soft);color:var(--L)}.pc-LANGUAGE .ic{background:var(--U-soft);color:var(--U)}
.pc-READING .ic{background:var(--R-soft);color:var(--R)}.pc-WRITING .ic{background:var(--W-soft);color:var(--W)}
.bar{height:4px;position:absolute;left:0;top:0;right:0}
.pc-LISTENING .bar{background:var(--L)}.pc-LANGUAGE .bar{background:var(--U)}.pc-READING .bar{background:var(--R)}.pc-WRITING .bar{background:var(--W)}

/* ---------- list ---------- */
.ph{display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.back{border:none;background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.group{margin-bottom:22px}
.group h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:10px;font-weight:700}
.exlist{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.exlist{grid-template-columns:1fr 1fr}}
.ex{padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%}
.ex .main{flex:1;min-width:0}
.ex .t{font-weight:600;margin-bottom:6px}
.ex .row{gap:6px}
.score-pill{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted)}
.score-pill.good{background:var(--ok-soft);color:var(--ok)}.score-pill.mid{background:var(--warn-soft);color:var(--warn)}.score-pill.low{background:var(--bad-soft);color:var(--bad)}

/* ---------- exam ---------- */
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.ebar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.ebar .tt{min-width:0;flex:1}
.ebar .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ebar .tt>span{font-size:12.5px;color:var(--muted);white-space:nowrap}
@media(max-width:599px){.ebar .ty{display:none}.inl{min-width:6.5em}.ebar .wrap{gap:8px}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:8px 12px;border-radius:12px;background:var(--surface-2);display:flex;gap:6px;align-items:center;flex:none}
.timer.warn{background:var(--bad-soft);color:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.prog{height:3px;background:var(--surface-2)}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.instr{padding:14px 16px;margin-bottom:14px;background:var(--brand-soft);border:none;color:var(--ink);white-space:pre-line;font-size:14.5px}
.instr b{color:var(--brand)}
.ptabs{display:none;margin-bottom:12px}
.exam-body{display:grid;gap:14px}
@media(min-width:760px){
  .exam-body.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .exam-body.two .pane{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;scrollbar-width:thin}
}
@media(max-width:759px){.ptabs.show{display:flex}.pane.off{display:none}}
.passage{padding:20px 22px;font-size:15.5px;line-height:1.75}
.passage p{margin:0 0 14px}
.passage .ptitle{text-align:center;font-size:18px;margin:0 0 14px}
.passage .gapblock{margin:6px 0 16px;padding:12px;border:2px dashed var(--line);border-radius:12px;text-align:center}
.qn{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-size:12px;font-weight:700;margin-right:4px;vertical-align:1px}
.inl{border:none;border-bottom:2px solid var(--brand);background:var(--brand-soft);border-radius:8px 8px 2px 2px;padding:2px 8px;min-width:8em;max-width:100%;outline:none;color:var(--ink);font-size:15px;line-height:1.6}
.inl:focus{box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
select.inl{min-width:5.5em;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px;margin-bottom:14px}
.chips span{padding:6px 12px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:13.5px;letter-spacing:.03em}
.choices{padding:6px 16px;margin-bottom:14px}
.choices .c{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.choices .c:last-child{border-bottom:none}
.choices .c b{flex:none;min-width:30px;color:var(--brand)}
.q{padding:16px;margin-bottom:12px}
.q .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.q .qh .qn{flex:none;margin-top:1px}
.q .qh .pr{flex:1}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;transition:border .12s,background .12s}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.on .l{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tf .opt{justify-content:center;align-items:center;flex-direction:column;gap:2px;padding:10px 6px;text-align:center}
.tf .opt b{font-size:16px}
.tf .opt small{font-size:11.5px;color:var(--muted)}
.tf .opt.on small{color:var(--brand)}
.kw{display:inline-block;padding:3px 10px;border-radius:8px;background:var(--W-soft);color:var(--W);font-weight:700;letter-spacing:.06em;font-size:13px;margin:0 0 10px}
.lead{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.lead .fx{padding-top:10px;font-weight:600}
.lead textarea{flex:1 1 240px;min-height:46px;resize:vertical}
.errrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.preview{padding:16px 18px;margin-top:6px;line-height:1.7}
.preview .lab{font-weight:700;color:var(--brand);margin-right:4px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin:18px 0 40px}
.audio{padding:16px;margin-bottom:14px}
.audio.sticky{position:sticky;top:66px;z-index:20}
.audio .ar{display:flex;gap:14px;align-items:center}
.play{width:54px;height:54px;border-radius:50%;border:none;background:var(--L);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--L) 35%,transparent)}
.play[disabled]{opacity:.45}
.abar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;cursor:pointer}
.abar i{display:block;height:100%;width:0;background:var(--L);border-radius:99px}
.ameta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;gap:8px}

/* ---------- result ---------- */
.rs{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:18px}
@media(min-width:720px){.rs{grid-template-columns:auto 1fr}}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:26px;display:block;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.rsum{padding:20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.rsum .kv{display:grid;gap:4px}
.rsum .kv b{font-size:20px}
.rq{padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--line)}
.rq.ok{border-left-color:var(--ok)}.rq.bad{border-left-color:var(--bad)}.rq.rv{border-left-color:var(--warn)}
.rq .ans{display:grid;gap:4px;margin-top:8px;font-size:14px}
.rq .ans .y{color:var(--bad)}.rq.ok .ans .y{color:var(--ok)}
.rq .ans .c{color:var(--ok)}
.rq .ex{margin-top:8px;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 11px}

/* ---------- admin ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.tabs button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px;padding:0 5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{padding:16px}
.kpi b{font-size:26px;display:block;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
.ulist{display:grid;gap:10px}
.u{padding:14px 16px}
.u .top{display:flex;gap:12px;align-items:flex-start}
.u .nm{font-weight:700}
.u .meta{font-size:13px;color:var(--muted)}
.u .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.filters{display:grid;gap:10px;margin-bottom:14px}
@media(min-width:720px){.filters{grid-template-columns:1fr 1fr auto}}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);border:none;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.ovr{display:flex;gap:6px;margin-top:10px}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:60;display:grid;place-items:center;padding:16px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.modal{width:100%;max-width:440px;padding:22px;animation:up .18s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.modal h2{margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:up .2s}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}


.blank{display:inline-flex;align-items:center;gap:6px;border:none;border-bottom:2px dashed #a855f7;background:var(--brand-soft);border-radius:8px 8px 2px 2px;padding:1px 8px 1px 3px;margin:0 2px;font:inherit;line-height:1.5;color:var(--ink);cursor:pointer;vertical-align:baseline;max-width:100%}
.blank .bn{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:700}
.blank .bv{min-width:4.5em;white-space:normal;text-align:left}
.blank.filled{border-bottom-style:solid;border-bottom-color:#16a34a;background:color-mix(in srgb,#16a34a 10%,var(--surface));font-weight:600}
.gapblock .blank{display:flex;width:100%}
.compact .q{padding:12px 14px;margin-bottom:10px}.compact .q .qh{margin-bottom:8px}.compact .opts{grid-template-columns:1fr 1fr;gap:6px}.compact .opt{padding:8px 10px}
.q.flash{animation:flash 1.1s ease}

.bankhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,#8b5cf6 12%,var(--surface)),color-mix(in srgb,#f97316 10%,var(--surface)));border:none}

  --gR:linear-gradient(135deg,#059669,#14b8a6);--gW:linear-gradient(135deg,#ea580c,#f59e0b);

body{background:

body::before{background:#5b21b6}

.topbar .brand span{font-size:16.5px}

img.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,255,255,.28);background:#fff}
.nav button{color:rgba(255,255,255,.88)}

.nav button.on{background:#fff;color:#7c3aed}
.topbar .avatar{background:#fde047;color:#7c2d12;box-shadow:0 0 0 2px rgba(255,255,255,.6)}

.qn{background:var(--grad);color:#fff}

.seg button.on{color:#7c3aed}
.tabs button.on{background:var(--grad);border-color:transparent;color:#fff}

.play{background:var(--gL)}.abar i{background:var(--grad-warm)}

.auth{position:relative;overflow:hidden;background:linear-gradient(135deg,#4c1d95 0%,#7e22ce 35%,#db2777 70%,#f97316 100%)}

.auth::before{width:420px;height:420px;left:-140px;top:-120px;background:radial-gradient(circle,#38bdf8,transparent 65%)}

.alogo{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,#7c3aed,#ec4899,#f97316,#facc15,#22c55e,#0ea5e9,#7c3aed);box-shadow:0 12px 30px rgba(192,38,211,.35)}
.alogo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--surface);display:block}

.part{border:none;color:#fff;min-height:170px;box-shadow:0 12px 28px rgba(60,20,120,.18)}

.score-pill.mid{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}

.kpis .kpi:nth-child(3){background:color-mix(in srgb,#0ea5e9 12%,var(--surface))}.kpis .kpi:nth-child(3) b{color:#0284c7}

  if (S.view === 'exam') { app.innerHTML = viewExam(); afterExam(); return; }
  var body = '';
  if (S.view === 'home') body = viewHome();
  else if (S.view === 'part') body = viewPart();
  else if (S.view === 'result') body = viewResult();
  else if (S.view === 'history') body = viewHistory();
  else if (S.view === 'admin') body = viewAdmin();
  app.innerHTML = topbar() + '<main class="wrap">' + body + '</main>';
  if (S.view === 'home' && !S.exercises) loadExercises();

    if (au.loading) return;
    au.loading = true; setPlayIcon('clock');

        a.src = au.url; $('#atime').textContent = '0:00'; audioToggle();

    };

      '<div class="small muted" style="margin-top:6px">Mỗi câu bắt đầu bằng số (1. 2. …), cách nhau một dòng trống. Dùng các dòng <b>Đáp án:</b>, <b>Giải thích:</b>, <b>Từ khoá:</b>, <b>Mở đầu:</b>, <b>Kết thúc:</b>. Nhiều đáp án đúng: cách nhau bởi dấu |. Có thể dán thẳng từ Word.</div>' +
    '</div></div>' +
    '<div><div class="card pad edside" id="edprev">' + edPreviewHtml() + '</div></div></div>' +
    '<div class="foot"><label class="row small" style="gap:8px;margin-right:auto"><button class="sw ' + (d.active ? 'on' : '') + '" data-act="edact" aria-label="Hiển thị cho học sinh"></button>Hiển thị cho học sinh</label>' +
    '<button class="btn" data-act="edcancel">Huỷ</button><button class="btn primary" data-act="edsave">' + icon('check', 18) + 'Lưu bài tập</button></div>';
  return h + x;
}
function edRefreshPreview() { clearTimeout(window._edp); window._edp = setTimeout(function () { var el = $('#edprev'); if (el) el.innerHTML = edPreviewHtml(); }, 250); }
function openEditor(id, copy) {
  A.tab = 'exedit';
  if (!id) { A.ed = newDraft(A.exPart && A.exPart !== 'ALL' ? A.exPart : 'LANGUAGE'); render(); window.scrollTo(0, 0); return; }
  A.ed = { loading: true }; render();
  call('adminGetExercise', { id: id }).then(function (r) {
    var e = r.ex;
    A.ed = { id: copy ? '' : e.id, part: e.part, type: e.type, level: e.level, title: e.title + (copy ? ' (bản sao)' : ''), timeLimit: e.timeLimit, maxPlays: e.maxPlays || '2',
      instructions: e.instructions, passage: e.passage, choices: e.choices, audioFileId: e.audioFileId, active: copy ? false : e.active, qtext: itemsToText(r.items) };
    render(); window.scrollTo(0, 0);
  }).catch(function (er) { toast(er.message, 'err'); A.tab = 'exercises'; render(); });
}
function saveEditor(btn) {
  var d = A.ed, c = edCheck();
  var hard = c.errors.filter(function (e) { return e.indexOf('Chưa gắn file nghe') < 0; });
  if (hard.length) { toast('Còn ' + hard.length + ' lỗi – xem khung “Xem trước”.', 'err'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  call('adminSaveExercise', { ex: { id: d.id, part: d.part, type: d.type, level: d.level, title: d.title, timeLimit: d.timeLimit, maxPlays: d.maxPlays,
      instructions: d.instructions, passage: d.passage, choices: d.choices, audioFileId: d.audioFileId, active: d.active }, items: c.items })
    .then(function (r) { toast((r.created ? 'Đã thêm bài ' : 'Đã lưu bài ') + r.id + ' (' + r.items + ' câu).', 'ok'); A.ed = null; A.tab = 'exercises'; invalidate('exs', 'ov'); S.exercises = null; render(); window.scrollTo(0, 0); })
    .catch(function (er) { btn.disabled = false; btn.innerHTML = icon('check', 18) + 'Lưu bài tập'; toast(er.message, 'err'); });
}
function uploadAudio(file) {
  var st = $('#edaust');
  if (file.size > 25 * 1024 * 1024) { toast('File quá lớn (tối đa 25 MB).', 'err'); return; }
  st.className = 'small muted'; st.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px;vertical-align:-2px"></span> Đang tải lên ' + esc(file.name) + '…';
  var rd = new FileReader();
  rd.onload = function () {
    var b64 = String(rd.result).split(',')[1] || '';
    call('adminUploadAudio', { name: file.name, mime: file.type || 'audio/mpeg', b64: b64 }).then(function (r) {
      if (!A.ed) return;
      A.ed.audioFileId = r.id; A.ed.audioName = r.name;
      var inp = $('[data-ed=audioFileId]'); if (inp) inp.value = r.id;
      st.className = 'small okc'; st.textContent = '✓ Đã tải lên: ' + r.name; edRefreshPreview();
    }).catch(function (er) { st.className = 'small'; st.style.color = 'var(--bad)'; st.textContent = er.message; });
  };
  rd.readAsDataURL(file);
}
function viewExBank(h) {
  if (!A.exs) return h + '<div class="loading"><span class="spin"></span>Đang tải…</div>';
  var fp = A.exPart || 'ALL', fl = A.exLv || 'ALL', q = (A.exQ || '').toLowerCase();
  var list = A.exs.filter(function (e) { return (fp === 'ALL' || e.part === fp) && (fl === 'ALL' || e.level === fl) && (!q || (e.title + ' ' + e.id + ' ' + (TYPES[e.type] || '')).toLowerCase().indexOf(q) >= 0); });
  var top = '<div class="card pad bankhead"><div><h3>Kho bài tập</h3><div class="muted small">' + A.exs.length + ' bài · ' + A.exs.filter(function (e) { return e.active; }).length + ' bài đang mở cho học sinh</div></div>' +
    '<button class="btn primary" data-act="exnew">+ Thêm bài tập</button></div>' +
    '<div class="filters" style="grid-template-columns:1fr auto auto"><input class="input" id="exq" placeholder="Tìm theo tên hoặc mã bài…" value="' + esc(A.exQ || '') + '">' +
    '<select class="input" id="exp"><option value="ALL">Tất cả các phần</option>' + PART_ORDER.map(function (p) { return '<option value="' + p + '"' + (fp === p ? ' selected' : '') + '>' + PARTS[p].name + '</option>'; }).join('') + '</select>' +
    '<select class="input" id="exl"><option value="ALL">Mọi cấp độ</option>' + ['B1', 'B2', 'C1'].map(function (l) { return '<option' + (fl === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></div>';
  if (!list.length) return h + top + '<div class="card empty">Không có bài phù hợp.</div>';
  return h + top + PART_ORDER.map(function (p) {
    var g = list.filter(function (e) { return e.part === p; });
    if (!g.length) return '';
    return '<div class="group"><h3>' + PARTS[p].name + ' · ' + g.length + '</h3><div class="ulist">' + g.map(function (e) {
      return '<div class="card u ex pe-' + p + '" style="display:block;cursor:default"><div class="top"><div style="flex:1;min-width:0"><div class="nm">' + esc(e.title) + '</div><div class="row" style="gap:6px;margin-top:6px">' + lvBadge(e.level) +
        '<span class="badge">' + esc(TYPES[e.type] || e.type) + '</span><span class="badge">' + e.itemCount + ' câu</span><span class="badge">' + e.attempts + ' lượt' + (e.avgPercent != null ? ' · TB ' + e.avgPercent + '%' : '') + '</span>' +
        (p === 'LISTENING' ? (e.hasAudio ? '<span class="badge b-ok">Đã gắn audio</span>' : '<span class="badge b-warn">Chưa gắn audio</span>') : '') + '</div><div class="small muted" style="margin-top:4px">Mã: ' + esc(e.id) + '</div></div>' +
        '<button class="sw ' + (e.active ? 'on' : '') + '" data-act="exsw" data-id="' + esc(e.id) + '" aria-label="Hiển thị"></button></div>' +
        '<div class="acts"><button class="btn sm" data-act="open" data-id="' + esc(e.id) + '">' + icon('play', 12) + 'Làm thử</button><button class="btn sm" data-act="exedit" data-id="' + esc(e.id) + '">' + icon('pen', 14) + 'Sửa</button>' +
        '<button class="btn sm" data-act="excopy" data-id="' + esc(e.id) + '">Nhân bản</button><button class="btn sm danger" data-act="exdel" data-id="' + esc(e.id) + '">Xoá</button></div></div>';
    }).join('') + '</div></div>';
  }).join('');
}

/* ================================================================ EVENTS */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), d = t.dataset;
  switch (act) {
    case 'atab': authTab = d.t; authMsg = null; render(); break;
    case 'menu': e.stopPropagation(); openMenu(); break;
    case 'logout': var m = $('.menu'); if (m) m.remove(); call('logout').catch(function () {}); S.token = null; S.user = null; S.role = null; S.exercises = null; S.history = null; S.admin = A = { tab: 'overview' }; store('hsg_token', null); go('auth'); break;
    case 'chpass': var m2 = $('.menu'); if (m2) m2.remove(); changePass(false); break;
    case 'theme': var r = document.documentElement, dark = r.getAttribute('data-theme') ? r.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); store('hsg_theme', dark ? 'light' : 'dark'); break;
    case 'home': go(S.role === 'admin' ? 'admin' : 'home'); break;
    case 'nav': go(d.v); break;
    case 'part': S.level = 'ALL'; go('part', { part: d.p }); break;
    case 'lv': S.level = d.l; render(); break;
    case 'open': openExercise(d.id); break;
    case 'leave': leaveExam(); break;
    case 'submit': submitAsk(); break;
    case 'pane': S.cur.pane = d.p; $$('.ptabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === d.p); }); var pm = $('#pmat'), pq = $('#pqs'); if (pm) pm.classList.toggle('off', d.p !== 'mat'); if (pq) pq.classList.toggle('off', d.p !== 'qs'); window.scrollTo(0, 0); break;
    case 'goq': if (S.cur.pane === 'mat' && $('.ptabs.show') && getComputedStyle($('.ptabs.show')).display !== 'none') { S.cur.pane = 'qs'; $$('.ptabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === 'qs'); }); $('#pmat').classList.add('off'); $('#pqs').classList.remove('off'); }
      var qc = $('#q' + d.no); if (qc) { qc.scrollIntoView({ behavior: 'smooth', block: 'center' }); qc.classList.remove('flash'); void qc.offsetWidth; qc.classList.add('flash'); var f = $('input,select,textarea', qc); if (f) setTimeout(function () { f.focus({ preventScroll: true }); }, 350); } break;
    case 'pick': S.cur.answers[+d.no] = d.val; $$('[data-act=pick][data-no="' + d.no + '"]').forEach(function (b) { b.classList.toggle('on', b.dataset.val === d.val); }); updateProgress(); break;
    case 'aplay': audioToggle(); break;
    case 'rf': S.resFilter = d.f; render(); break;
    case 'resback': S.resFilter = 'all'; if (S.result && S.result.fromHistory) go('history'); else go('part', { part: S.result && S.result.exercise ? S.result.exercise.part : S.part }); break;
    case 'attempt': openAttempt(d.id); break;
    case 'atabs': A.tab = d.t; render(); break;
    case 'exnew': openEditor(null); break;
    case 'exedit': openEditor(d.id); break;
    case 'excopy': openEditor(d.id, true); break;
    case 'exdel': var dx = (A.exs || []).filter(function (x) { return x.id === d.id; })[0];
      confirmBox('Xoá bài tập?', '<p>Bài <b>' + esc(dx ? dx.title : d.id) + '</b> và toàn bộ câu hỏi sẽ bị xoá khỏi kho. Kết quả học sinh đã làm vẫn được giữ lại.</p><p class="small muted">Nếu chỉ muốn tạm ẩn, hãy tắt công tắc “Hiển thị”.</p>', 'Xoá bài', 'danger')
        .then(function (ok) { if (!ok) return; call('adminDeleteExercise', { id: d.id }).then(function () { toast('Đã xoá bài.', 'ok'); invalidate('exs', 'ov'); S.exercises = null; render(); }).catch(function (er) { toast(er.message, 'err'); }); }); break;
    case 'edcancel': if (A.ed && (A.ed.qtext || A.ed.title) && !A.ed.loading) { confirmBox('Thoát trình soạn bài?', '<p>Những thay đổi chưa lưu sẽ bị mất.</p>', 'Thoát', 'danger').then(function (ok) { if (ok) { A.ed = null; A.tab = 'exercises'; render(); } }); } else { A.ed = null; A.tab = 'exercises'; render(); } break;
    case 'edsave': saveEditor(t); break;
    case 'edact': A.ed.active = !A.ed.active; t.classList.toggle('on', A.ed.active); break;
    case 'edshow': A.ed['show_' + d.f] = true; render(); var ta = $('[data-ed=' + d.f + ']'); if (ta) ta.focus(); break;
    case 'edtpl': var tp = TPL[tplKey(A.ed.type)], go2 = function () { if (tp.p && !String(A.ed.passage).trim()) A.ed.passage = tp.p; if (tp.c && !String(A.ed.choices).trim()) A.ed.choices = tp.c; A.ed.qtext = tp.q; render(); };
      if (String(A.ed.qtext).trim()) confirmBox('Chèn mẫu?', '<p>Nội dung ô “Câu hỏi và đáp án” hiện tại sẽ được thay bằng mẫu.</p>', 'Chèn mẫu').then(function (ok) { if (ok) go2(); }); else go2(); break;
    case 'arefresh': refreshAdmin(); break;
    case 'ust': call('adminSetStatus', { userId: d.id, status: d.s }).then(function () { toast(d.s === 'DA_DUYET' ? 'Đã duyệt tài khoản.' : 'Đã khoá tài khoản.', 'ok'); invalidate('users', 'ov'); render(); }).catch(function (er) { toast(er.message, 'err'); }); break;
    case 'udel': confirmBox('Xoá tài khoản?', '<p>Tài khoản sẽ bị xoá khỏi danh sách. Kết quả đã làm vẫn được giữ trong trang KetQua.</p>', 'Xoá', 'danger').then(function (ok) { if (!ok) return; call('adminDeleteUser', { userId: d.id }).then(function () { toast('Đã xoá.', 'ok'); invalidate('users', 'ov'); render(); }).catch(function (er) { toast(er.message, 'err'); }); }); break;
    case 'upw': confirmBox('Đặt lại mật khẩu?', '<p>Hệ thống sẽ tạo một mật khẩu mới gồm 6 chữ số.</p>', 'Đặt lại').then(function (ok) { if (!ok) return; call('adminResetPass', { userId: d.id }).then(function (x) { modal({ title: 'Mật khẩu mới', html: '<p>Gửi mật khẩu này cho học sinh:</p><div class="card pad" style="text-align:center;font-size:28px;font-weight:700;letter-spacing:.15em">' + esc(x.password) + '</div><p class="small muted">Học sinh có thể đổi lại trong mục Đổi mật khẩu.</p>' }); }).catch(function (er) { toast(er.message, 'err'); }); }); break;
    case 'ures': A.fUser = d.id; A.fEx = ''; invalidate('results'); A.tab = 'results'; render(); break;
    case 'frv': A.fReview = !A.fReview; invalidate('results'); render(); break;
    case 'exsw': var on = !t.classList.contains('on'); t.classList.toggle('on', on); call('adminToggleExercise', { id: d.id, active: on }).then(function () { toast(on ? 'Đã mở bài cho học sinh.' : 'Đã ẩn bài.', 'ok'); var ex = (A.exs || []).filter(function (x) { return x.id === d.id; })[0]; if (ex) ex.active = on; S.exercises = null; }).catch(function (er) { t.classList.toggle('on', !on); toast(er.message, 'err'); }); break;
    case 'ovr': t.disabled = true; call('adminOverride', { attemptId: d.a, no: +d.no, correct: d.c === '1' }).then(function (x) { A.attempt = x; invalidate('results', 'ov'); render(); toast('Đã cập nhật điểm: ' + x.score + '/' + x.total, 'ok'); }).catch(function (er) { t.disabled = false; toast(er.message, 'err'); }); break;
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.ed && A.ed) { A.ed[t.dataset.ed] = t.value; if (t.dataset.ed === 'audioFileId') A.ed.audioName = ''; edRefreshPreview(); return; }
  if (t.id === 'exq') { A.exQ = t.value; clearTimeout(window._exq); window._exq = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#exq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); return; }
  if (t.id === 'uq') { A.q = t.value; clearTimeout(window._uq); window._uq = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#uq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); return; }
  if (!t.dataset || !t.dataset.no || !S.cur || S.view !== 'exam') return;
  var no = +t.dataset.no;
  if (t.dataset.f) { var v = S.cur.answers[no] || { wrong: '', fix: '' }; v[t.dataset.f] = t.value; S.cur.answers[no] = v; }
  else S.cur.answers[no] = t.value;
  if (t.tagName === 'TEXTAREA') autosize(t);
  updateProgress();
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'edaudio' && t.files && t.files[0]) { uploadAudio(t.files[0]); t.value = ''; return; }
  if (t.tagName === 'SELECT' && t.dataset.ed && A.ed) { var f = t.dataset.ed; A.ed[f] = t.value; if (f === 'part') A.ed.type = PART_TYPES[t.value][0]; render(); return; }
  if (t.id === 'exp') { A.exPart = t.value; render(); return; }
  if (t.id === 'exl') { A.exLv = t.value; render(); return; }
  if (t.id === 'fu') { A.fUser = t.value; invalidate('results'); render(); return; }
  if (t.id === 'fe') { A.fEx = t.value; invalidate('results'); render(); return; }
  if (t.tagName === 'SELECT' && t.dataset.no && S.cur && S.view === 'exam') { S.cur.answers[+t.dataset.no] = t.value; updateProgress(); }
});
window.addEventListener('beforeunload', function (e) { if (S.view === 'exam') { e.preventDefault(); e.returnValue = ''; } });

/* ================================================================== BOOT */
(function boot() {
  var th = store('hsg_theme'); if (th) document.documentElement.setAttribute('data-theme', th);
  S.token = store('hsg_token');
  if (!S.token) { S.view = 'auth'; render(); return; }
  call('me').then(function (d) {
    S.user = d.user; S.role = d.user.role; S.mustChange = !!d.mustChange; if (d.appName) S.appName = d.appName;
    go(S.role === 'admin' ? 'admin' : 'home');
    if (S.mustChange) setTimeout(function () { changePass(true); }, 300);
  }).catch(function () { S.token = null; store('hsg_token', null); S.view = 'auth'; render(); });
})();
</script>
